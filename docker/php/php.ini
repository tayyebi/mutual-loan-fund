; Application PHP settings.

memory_limit = 512M
max_execution_time = 120

; Receipt uploads (JPEG / PNG / PDF).
upload_max_filesize = 12M
post_max_size = 16M

expose_php = Off
date.timezone = UTC

; Financial arithmetic is done with bcmath decimal strings, never floats.
bcmath.scale = 0

; Opcache is enabled but revalidates on every request so that source edits on the
; bind-mounted host directory take effect immediately, with no container restart.
opcache.enable = 1
opcache.enable_cli = 0
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
opcache.memory_consumption = 192
opcache.max_accelerated_files = 20000

; Sessions are handled by Laravel (database driver), not by PHP.
session.auto_start = Off
