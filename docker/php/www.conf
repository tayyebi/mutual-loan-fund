[www]
listen = 0.0.0.0:9000

; The entrypoint drops privileges, so php-fpm workers already run as the app user.
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

catch_workers_output = yes
decorate_workers_output = no
access.log = /proc/self/fd/2
