server {
    listen 8088 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;

    root /var/www/html/public;
    index index.php;

    charset utf-8;
    client_max_body_size 16m;

    # sendfile is disabled because the document root is a bind mount; with some
    # host filesystems it serves stale bytes after an edit.
    sendfile off;

    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # TLS is terminated at nginx; tell PHP-FPM the request arrived over HTTPS
        # so Laravel generates https:// URLs and sets the secure session cookie.
        fastcgi_param HTTPS on;
        fastcgi_hide_header X-Powered-By;
        fastcgi_read_timeout 120;
    }

    # Never serve dotfiles or anything outside public/.
    location ~ /\.(?!well-known).* {
        deny all;
    }
}
